version: '3.8'

services:
  gateway:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    ports:
      - "8080:8080"
    depends_on:
      auth-service:
        condition: service_started
    networks:
      - app-network
    restart: unless-stopped

  auth-service:
    build:
      context: ../auth-service
      dockerfile: Dockerfile
    env_file:
      - ../auth-service/.env
    ports:
      - "8081:8081"
    networks:
      - app-network
    restart: unless-stopped

  user-service:
    build:
      context: ../user-service
      dockerfile: Dockerfile
    env_file:
      - ../user-service/.env
    ports:
      - "8082:8082"
    networks:
      - app-network
    restart: unless-stopped

  event-service:
    build:
      context: ../event-service
      dockerfile: Dockerfile
    env_file:
      - ../event-service/.env
    ports:
      - "8083:8083"
    networks:
      - app-network
    restart: unless-stopped

  # gamification-service:
  #   build:
  #     context: ../gamification-service
  #     dockerfile: Dockerfile
  #   env_file:
  #     - ../gamification-service/.env
  #   ports:
  #     - "8084:8084"
  #   networks:
  #     - app-network
  #   restart: unless-stopped

networks:
  app-network:
    driver: bridge