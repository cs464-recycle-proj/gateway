version: '3.8'

services:
  gateway:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    ports:
      - "8080:8080"
    depends_on:
      auth-service:
        condition: service_started
    networks:
      - app-network
    restart: unless-stopped

  auth-service:
    build:
      context: ../auth-service
      dockerfile: Dockerfile
    env_file:
      - ../auth-service/.env
    ports:
      - "8081:8081"
    networks:
      - app-network
    restart: unless-stopped

networks:
  app-network:
    driver: bridge