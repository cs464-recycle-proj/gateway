# Gateway Service Configuration
replicaCount: 2

image:
  repository: registry.digitalocean.com/cs464-project/gateway-service
  pullPolicy: Always
  tag: "latest"

imagePullSecrets:
  - name: registry-cs464-project

service:
  type: ClusterIP
  port: 8080
  targetPort: 8080

ingress:
  enabled: true
  className: nginx
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
  hosts:
    - host: gateway.linyucong.com
      paths:
        - path: /
          pathType: Prefix
  tls:
    - secretName: gateway-tls
      hosts:
        - gateway.linyucong.com

resources:
  limits:
    cpu: 500m
    memory: 512Mi
  requests:
    cpu: 250m
    memory: 256Mi

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 10
  targetCPUUtilizationPercentage: 80
  targetMemoryUtilizationPercentage: 80

# Environment Variables
env:
  SERVER_PORT: "8080"
  
  # Spring Boot / Java Configuration
  SPRING_PROFILES_ACTIVE: "production"
  JAVA_OPTS: "-Xms256m -Xmx512m"
  
  # JWT Configuration
  JWT_COOKIE_NAME: "AUTH_TOKEN"
  
  # Microservices URLs (Internal Kubernetes DNS)
  AUTH_SERVICE_URL: "http://auth-service.auth.svc.cluster.local:8081"
  USER_SERVICE_URL: "http://user-service.user.svc.cluster.local:8082"
  EVENT_SERVICE_URL: "http://event-service.event.svc.cluster.local:8083"
  GAMIFICATION_SERVICE_URL: "http://gamification-service.gamification.svc.cluster.local:8080"
  
  # Logging Configuration
  LOG_LEVEL: "info"
  
  # CORS Configuration - Set to actual frontend domain in production
  CORS_ALLOWED_ORIGINS: "https://greenloop.linyucong.com,http://localhost:3000"
  
  # Health Check
  HEALTH_CHECK_PATH: "/actuator/health"
