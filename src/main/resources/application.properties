# ======================================
# Gateway Service Configuration
# ======================================

# Server Configuration
# Port on which the gateway service listens for incoming requests
server.port=8080

# Spring Application
# Unique name identifier for this service in the microservices ecosystem
spring.application.name=gateway-service

# External configuration import from .env file for environment-specific settings
# This allows sensitive configuration (secrets, URLs) to be kept outside version control
spring.config.import=optional:file:.env[.properties]

# ======================================
# JWT (JSON Web Token) Configuration
# ======================================

# Base64-encoded secret key for JWT signature verification
# IMPORTANT: This must match the secret used by the auth service to sign tokens
# Should be at least 256 bits (32 bytes) for HS256 algorithm
jwt.secret=${JWT_SECRET}

# Name of the HTTP cookie that contains the JWT token
# The gateway extracts the token from this cookie for authentication
jwt.cookie.name=${JWT_COOKIE_NAME}

# ======================================
# Microservices URLs
# ======================================

# Auth Service - Handles user authentication, registration, and OTP verification
# Example: http://localhost:8081 or http://auth-service:8081 in Docker
auth.service.url=${AUTH_SERVICE_URL}

# User Service - Manages user profiles, preferences, and user-related operations
# Example: http://localhost:8082 or http://user-service:8082 in Docker
user.service.url=${USER_SERVICE_URL}

# Event Service - Handles event creation, management, and participation
# Example: http://localhost:8083 or http://event-service:8083 in Docker
event.service.url=${EVENT_SERVICE_URL}

# ======================================
# CORS (Cross-Origin Resource Sharing) Configuration
# ======================================

# Comma-separated list of allowed frontend origins for CORS
# In production, restrict this to your actual frontend domain(s)
# Example: https://greenloop.example.com
cors.allowed.origins=${CORS_ALLOWED_ORIGINS}

# ======================================
# Logging Configuration
# ======================================

# Root logging level - controls verbosity of logs (TRACE, DEBUG, INFO, WARN, ERROR)
logging.level.root=INFO

# Console log pattern for readable output with timestamp, thread, level, and logger
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n

# ======================================
# Actuator Configuration (Health Checks & Monitoring)
# ======================================

# Expose health endpoint for container health checks
management.endpoints.web.exposure.include=health,info

# Show detailed health information (use "always" for debugging, "when-authorized" for production)
management.endpoint.health.show-details=when-authorized

# Base path for actuator endpoints
management.endpoints.web.base-path=/actuator